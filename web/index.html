<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<title>RACK MONITOR BY DON</title>
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <a class="brand" href="#/painel"><img src="logo.png" alt=""><div><b>RACK MONITOR</b><small>BY DON · <span id="ver">V2</span></small></div></a>
    <div class="jobchip" id="jobchip"></div>
    <div class="spacer"></div>
    <button id="updBtn" class="hbtn upd" hidden title="Nova versão disponível">⬆ ATUALIZAR</button>
    <button id="statusPill" class="pill">CONECTANDO…</button>
    <button id="recWatch" class="hbtn" title="Vigilância de gravação">VIGILÂNCIA</button>
    <button id="ctrlBtn" class="hbtn" hidden>🔒 COMANDOS</button>
    <button id="soundBtn" class="hbtn" title="Alerta sonoro">🔇 SOM</button>
    <div class="clock" id="clock">--:--:--</div>
  </header>
  <nav id="nav">
    <a href="#/painel" data-v="painel">PAINEL</a>
    <a href="#/atem" data-v="atem">ATEM</a>
    <a href="#/gravacoes" data-v="gravacoes">GRAVAÇÕES</a>
    <a href="#/matriz" data-v="matriz">MATRIZ</a>
    <a href="#/timeline" data-v="timeline">LINHA DO TEMPO</a>
    <a href="#/relogio" data-v="relogio">RELÓGIO</a>
    <a href="#/pos" data-v="pos">PÓS-PRODUÇÃO</a>
    <a href="#/checklist" data-v="checklist">CHECKLIST</a>
    <a href="#/jobs" data-v="jobs">JOBS & RELATÓRIOS</a>
    <a href="#/saude" data-v="saude">SAÚDE</a>
    <a href="#/config" data-v="config">CONFIGURAÇÃO</a>
    <span class="spacer"></span>
    <a href="#/tally" data-v="tally">TALLY</a>
    <a href="#/wall" data-v="wall">TELÃO</a>
  </nav>
  <div id="banner" hidden></div>
  <main id="view"></main>
  <div id="conn" hidden>RECONECTANDO AO SERVIDOR…</div>
</div>
<div id="modal" hidden><div class="mbox"><div class="mhead"><b id="mtitle"></b><button class="x" id="mclose">✕</button></div><div id="mbody"></div></div></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
